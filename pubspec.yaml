name: anunnakitales
description: "Anunnaki Tales: mitos interactivos de Mesopotamia."
publish_to: 'none'

# Antes del + va la versión visible; después, el versionCode de Android.
# Hay que subirlo en cada build que se mande a Play (el último subido fue 11).
version: 1.1.0+12

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  intl: ^0.20.3
  flutter_animate: ^4.5.2
  url_launcher: ^6.3.2
  package_info_plus: ^10.2.1
  in_app_purchase: ^3.3.1
  in_app_purchase_android: ^0.5.3
  google_mobile_ads: ^9.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

# Ícono de la app (dart run flutter_launcher_icons). Herramienta de desarrollo,
# no va en la app. El adaptativo de Android usa el mismo PNG con el margen por
# defecto, así el dibujo entra entero en la máscara redonda del teléfono.
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  ios: true
  # La App Store rechaza íconos con transparencia.
  remove_alpha_ios: true
  adaptive_icon_background: "#0A0E1A"
  adaptive_icon_foreground: "assets/icon/icon.png"

# Pantalla de arranque (dart run flutter_native_splash:create). Herramienta de
# desarrollo. splash.png es icon.png achicado al centro de un lienzo
# transparente de 1152 px: Android 12+ recorta el centro en círculo.
flutter_native_splash:
  color: "#0A0E1A"
  image: assets/icon/splash.png
  android_12:
    color: "#0A0E1A"
    image: assets/icon/splash.png

flutter:
  uses-material-design: true
  # Genera las clases de traducción desde lib/l10n/*.arb (ver l10n.yaml).
  generate: true

  # Catálogo e historias (ver "Contenido" en CLAUDE.md). Cada carpeta se
  # declara aparte: Flutter no incluye las subcarpetas solas.
  assets:
    - assets/data/
    - assets/data/stories/

  fonts:
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cinzel-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cinzel-Bold.ttf
          weight: 700
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-Regular.ttf
          weight: 400
        - asset: assets/fonts/Lora-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Lora-SemiBold.ttf
          weight: 600
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
